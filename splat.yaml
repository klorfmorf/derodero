name: Ganbare Goemon - Dero Dero Douchuu Obake Tenkomori (Japan)
sha1: 105b2f5d14026caabdd6092e9c8d0885a618e31e
options:
  basename: derodero

  base_path: .
  target_path: derodero_dec.z64
  platform: n64
  compiler: IDO

  src_path: source

  gfx_ucode: f3dex2
  
  # find_file_boundaries: True
  # find_file_boundaries: False
  migrate_rodata_to_functions: False

  add_set_gp_64: True

  symbol_name_format: $VRAM_$ROM

  symbol_addrs_path: symbol_addrs.txt
  
segments:
  - name: header
    type: header
    start: 0x000000

  - name: ipl3
    type: bin
    start: 0x000040

  - name: entry
    type: code
    start: 0x001000
    vram: 0x80000400
    subsegments:
      - [0x001000, hasm, entry]
    
  - name: boot
    type: code
    start: 0x001060
    vram: 0x80000460
    follows_vram: entry
    subsegments:
    # I tried keeping most of the naming here accurate based on debug strings/information from this game and other Konami games
    - [0x001060, asm, game/sched] # Schedules libultra OSTasks
    - [0x0019E0, asm, game/main] # Creates threads and contains the main game loop
    - [0x002410, asm, game/gfx] # Graphics task initialization and dispatch
    - [0x002710, asm, game/dma] # Direct memory access handling
    - [0x002950, asm, game/pak] # Controller accessory handling
    - [0x002FB0, asm, game/decode] # Data decompression
    - [0x003870, asm, game/trans] # Data loading
    - [0x004950, asm, game/clear] # Framebuffer and Z-buffer clearing operations
    - [0x005260, asm, game/arena] # Arena allocator
    - [0x0054D0, asm, game/heap] # Heap allocator
    - [0x0058F0, asm, game/pic] # PIC texture and sprite decoding
    - [0x007280, asm, game/seginfo] # Data caching
    - [0x007DD0, asm, game/audiomgr] # Sound task initialization and dispatch
    - [0x008720, asm, game/sd_main] # Responsible for handling communications between the game logic and the sound driver, handles loading sequences and queuing them up for play, fade-outs, speeding up and slowing down, crossfades, etc.
    - [0x00B6A0, asm, game/sd_sub1] # Player responsible for stepping through the sequence and timing the steps
    - [0x00CF20, asm, game/sd_sub2] # Controls called by the player when stepping through the sequence; Volume, pan, pitch bends, vibrato, loops, instrument changes, etc.

    - [0x00EFF0, asm, libultra/os/sendmesg]
